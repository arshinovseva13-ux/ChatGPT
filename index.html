<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101116">
<title>CLOSE Browser — твой интернет</title>
<style>
:root{color-scheme:dark;--bg:#101116;--panel:#191a22;--panel2:#22232d;--line:#30313d;--text:#f5f5fa;--muted:#a4a5b5;--accent:#8b7cff;--accent2:#4ed9c1;--radius:18px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}button,input{font:inherit}button{cursor:pointer;color:inherit;border:0}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.app{min-height:100vh;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% -20%,#37305f55,transparent 48%),var(--bg)}
.top{padding:12px 16px 0;border-bottom:1px solid var(--line);background:#121319eF;backdrop-filter:blur(18px);position:sticky;top:0;z-index:5}.brandrow{display:flex;align-items:center;gap:12px;margin-bottom:12px}.logo{width:34px;height:34px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#42d9c2);display:grid;place-items:center;color:#101116;font-weight:1000;font-size:17px;box-shadow:0 5px 20px #8b7cff40}.brand{font-weight:850;letter-spacing:-.5px;font-size:16px}.brand small{display:block;font-size:10px;letter-spacing:2px;color:var(--muted);font-weight:700}.topspacer{flex:1}.iconbtn{width:34px;height:34px;border-radius:11px;background:transparent;color:var(--muted);display:grid;place-items:center;font-size:16px}.iconbtn:hover{background:var(--panel2);color:var(--text)}.tabs{display:flex;gap:5px;align-items:end;overflow:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{display:flex;align-items:center;gap:8px;min-width:110px;max-width:220px;padding:10px 12px;border-radius:12px 12px 0 0;background:transparent;color:var(--muted);white-space:nowrap}.tab.active{background:var(--panel);color:var(--text);box-shadow:inset 0 2px var(--accent)}.tabtitle{overflow:hidden;text-overflow:ellipsis;flex:1}.close-tab{opacity:.55;border-radius:6px;padding:1px 5px}.close-tab:hover{opacity:1;background:#ffffff14}.toolbar{display:flex;align-items:center;gap:7px;padding:10px 0 12px}.navbtn{height:36px;width:36px;border-radius:12px;background:transparent;color:var(--muted);font-size:17px;flex-shrink:0}.navbtn:hover{background:var(--panel2);color:var(--text)}.address{flex:1;display:flex;align-items:center;gap:9px;min-width:0;height:42px;padding:0 13px;border:1px solid var(--line);border-radius:15px;background:#0c0d12;transition:.2s}.address:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px #8b7cff20}.lock{color:var(--accent2)}#address{border:0;outline:0;background:transparent;color:var(--text);width:100%;min-width:0}.address button{background:transparent;color:var(--muted);padding:4px}.primary{background:var(--accent);color:white;border-radius:12px;padding:10px 14px;font-weight:750;white-space:nowrap}.primary:hover{filter:brightness(1.1)}.main{width:min(1120px,100%);margin:0 auto;padding:clamp(26px,6vw,70px) clamp(16px,4vw,34px) 36px;flex:1}.hero{max-width:760px;margin:0 auto}.greeting{font-size:12px;color:var(--accent2);font-weight:800;letter-spacing:2px;text-transform:uppercase;display:flex;align-items:center;gap:8px}.pulse{width:7px;height:7px;border-radius:50%;background:var(--accent2);box-shadow:0 0 12px var(--accent2)}h1{font-size:clamp(36px,7vw,66px);line-height:1.02;letter-spacing:-3px;margin:16px 0 12px;font-weight:900}h1 span{background:linear-gradient(100deg,#b7aaff,var(--accent2));color:transparent;background-clip:text}.subtitle{color:var(--muted);font-size:15px;margin-bottom:28px}.searchbox{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 16px;border:1px solid #4a466b;background:#1a1926;border-radius:20px;box-shadow:0 18px 60px #0004,0 0 0 5px #8b7cff0b}.searchbox .mag{font-size:20px;color:var(--accent)}.searchbox input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font-size:15px;padding:10px 0}.searchbox .primary{padding:12px 18px;border-radius:14px}.engines{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 36px;color:var(--muted);font-size:12px;align-items:center}.engine{padding:6px 10px;border-radius:10px;background:var(--panel);border:1px solid var(--line);color:var(--muted)}.engine.active{border-color:var(--accent);color:var(--text);background:#8b7cff18}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:0 0 14px}.sectionhead h2{font-size:14px;margin:0;font-weight:800}.sectionhead span{font-size:12px;color:var(--muted)}.shortcuts{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}.shortcut{background:transparent;border:1px solid transparent;border-radius:17px;padding:15px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0;position:relative}.shortcut:hover{background:var(--panel);border-color:var(--line)}.siteicon{height:48px;width:48px;border-radius:16px;display:grid;place-items:center;font-size:22px;font-weight:800;background:var(--panel2);border:1px solid #ffffff0b}.shortcut span:last-child{font-size:12px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.shortcut .remove{display:none;position:absolute;right:5px;top:3px;background:#343541;border-radius:8px;padding:2px 6px;color:var(--muted)}.shortcut:hover .remove{display:block}.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:34px}.info-card{background:linear-gradient(145deg,var(--panel),#171820);border:1px solid var(--line);border-radius:20px;padding:19px;min-height:130px}.cardtop{display:flex;align-items:center;gap:10px;font-weight:800;margin-bottom:10px}.cardicon{width:34px;height:34px;border-radius:11px;background:#8b7cff20;display:grid;place-items:center;font-size:17px}.info-card p{color:var(--muted);margin:0;font-size:13px}.quick-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.smallbtn{padding:8px 11px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:12px}.smallbtn:hover{border-color:var(--accent)}.bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:20px 24px;border-top:1px solid var(--line);color:var(--muted);font-size:11px}.bottom strong{color:var(--text)}.bottomright{display:flex;gap:14px}.bottom button{background:none;color:var(--muted);font-size:11px}.bottom button:hover{color:var(--text)}
.overlay{position:fixed;inset:0;background:#05060acc;backdrop-filter:blur(8px);z-index:10;display:none;align-items:flex-start;justify-content:center;padding:10vh 16px 20px}.overlay.show{display:flex}.dialog{width:min(560px,100%);background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 30px 100px #0008;max-height:80vh;overflow:auto}.dialoghead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.dialoghead h2{margin:0;font-size:18px}.dialog input,.dialog select{width:100%;padding:12px;border-radius:12px;background:var(--bg);border:1px solid var(--line);color:var(--text);margin:5px 0 12px}.dialog label{font-size:12px;color:var(--muted)}.entry{display:flex;gap:10px;align-items:center;padding:11px;border-radius:12px}.entry:hover{background:var(--panel2)}.entry .entryname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.entry small{display:block;color:var(--muted)}.empty{color:var(--muted);text-align:center;padding:28px 8px}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;transition:.25s;background:#2c2d39;border:1px solid var(--line);padding:11px 16px;border-radius:12px;z-index:20;box-shadow:0 8px 30px #0005}.toast.show{opacity:1;transform:translate(-50%,0)}.mobile-menu{display:none}
@media(max-width:700px){.top{padding-left:10px;padding-right:10px}.brandrow{margin-bottom:8px}.tabs .tab{min-width:100px;padding:9px}.toolbar{gap:3px}.toolbar .navbtn{width:31px}.toolbar .hide-mobile{display:none}.toolbar .primary{padding:10px 12px}.main{padding-top:38px}h1{letter-spacing:-2px}.shortcuts{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.siteicon{height:46px;width:46px}.cards{grid-template-columns:1fr}.bottom{padding:16px}.searchbox{gap:7px;padding-left:12px}.searchbox input{font-size:14px}.searchbox .primary{padding:11px 13px}.subtitle{font-size:14px}.engines{margin-bottom:28px}}
@media(max-width:380px){.brand small{display:none}.toolbar .optional{display:none}.shortcuts{grid-template-columns:repeat(3,minmax(0,1fr))}.searchbox .primary{font-size:12px;padding:10px}.logo{width:30px;height:30px}}
</style>
</head>
<body>
<div class="app">
<header class="top">
 <div class="brandrow">
  <div class="logo">C</div><div class="brand">CLOSE Browser<small>YOUR WEB. YOUR RULES.</small></div>
  <div class="topspacer"></div>
  <button class="iconbtn" title="Закладки" data-panel="bookmarks">☆</button>
  <button class="iconbtn" title="История" data-panel="history">◷</button>
  <button class="iconbtn" title="Настройки" data-panel="settings">⚙</button>
 </div>
 <div class="tabs" id="tabs"></div>
 <div class="toolbar">
  <button class="navbtn" title="Назад" id="back">‹</button><button class="navbtn" title="Вперёд" id="forward">›</button><button class="navbtn optional" title="Обновить" id="reload">↻</button>
  <form class="address" id="addressForm"><span class="lock" id="addressIcon">✦</span><input id="address" aria-label="Адрес или поисковый запрос" placeholder="Введите адрес или поисковый запрос" autocomplete="off" spellcheck="false"><button type="button" id="bookmarkCurrent" title="Добавить закладку">☆</button></form>
  <button class="primary" id="go">Перейти ↗</button><button class="navbtn optional" title="Новая вкладка" id="newTab">＋</button>
 </div>
</header>
<main class="main" id="view"></main>
<footer class="bottom"><div><strong>◈ CLOSE Browser</strong> · Независимый веб-компаньон</div><div class="bottomright"><span>Локальная история</span><button data-panel="privacy">Конфиденциальность</button><button data-panel="settings">Настройки</button></div></footer>
</div>
<div class="overlay" id="overlay"><section class="dialog"><div class="dialoghead"><h2 id="dialogTitle">Настройки</h2><button class="iconbtn" id="closeDialog" aria-label="Закрыть">✕</button></div><div id="dialogBody"></div></section></div>
<div class="toast" id="toast"></div>
<script>
(()=>{
const $=s=>document.querySelector(s);
const engines={Google:'https://www.google.com/search?q=',Bing:'https://www.bing.com/search?q=',DuckDuckGo:'https://duckduckgo.com/?q=',Brave:'https://search.brave.com/search?q='};
const defaults=[{name:'YouTube',url:'https://www.youtube.com',icon:'▶',color:'#ff3838'},{name:'Wikipedia',url:'https://www.wikipedia.org',icon:'W',color:'#c7c7d2'},{name:'GitHub',url:'https://github.com',icon:'⌘',color:'#b4a6ff'},{name:'Google',url:'https://www.google.com',icon:'G',color:'#62a6ff'},{name:'Reddit',url:'https://www.reddit.com',icon:'r',color:'#ff8b54'},{name:'Telegram',url:'https://web.telegram.org',icon:'➤',color:'#60c8f2'}];
let engine=localStorage.getItem('close-engine')||'Google';
let bookmarks=JSON.parse(localStorage.getItem('close-bookmarks')||'[]');
let history=JSON.parse(localStorage.getItem('close-history')||'[]');
let shortcuts=JSON.parse(localStorage.getItem('close-shortcuts')||'null')||defaults;
let tabs=[],active=0,tabCounter=0,theme=localStorage.getItem('close-theme')||'dark';
function save(){localStorage.setItem('close-bookmarks',JSON.stringify(bookmarks));localStorage.setItem('close-history',JSON.stringify(history));localStorage.setItem('close-shortcuts',JSON.stringify(shortcuts));}
function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),2300)}
function normalize(s){s=s.trim();if(!s)return null;if(/^([a-z]+:\/\/|localhost(?::\d+)?|\d{1,3}(\.\d{1,3}){3}(?::\d+)?)(\/|$)/i.test(s))return /^https?:\/\//i.test(s)?s:'https://'+s;if(/^\S+\.\S{2,}(\/.*)?$/i.test(s)&&!s.includes(' '))return 'https://'+s;return engines[engine]+encodeURIComponent(s)}
function addTab(url=''){const t={id:++tabCounter,title:'Новая вкладка',url:'',stack:[],pos:-1};tabs.push(t);active=tabs.length-1;renderTabs();if(url)navigate(url);else renderHome();return t}
function current(){return tabs[active]}
function renderTabs(){$('#tabs').innerHTML=tabs.map((t,i)=>'<button class="tab '+(i===active?'active':'')+'" data-tab="'+i+'"><span>◈</span><span class="tabtitle">'+esc(t.title)+'</span>'+(tabs.length>1?'<span class="close-tab" data-close="'+i+'">×</span>':'')+'</button>').join('')+'<button class="iconbtn" id="tabPlus" title="Новая вкладка">＋</button>'}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function navigate(raw,record=true){const url=normalize(raw);if(!url)return;const t=current();if(!t)return; t.stack=t.stack.slice(0,t.pos+1);t.stack.push(url);t.pos=t.stack.length-1;t.url=url;t.title=(()=>{try{return new URL(url).hostname.replace(/^www\./,'')}catch{return url}})();if(record){history.unshift({title:t.title,url,time:Date.now()});history=history.slice(0,250);save()}$('#address').value=url;$('#addressIcon').textContent='🔒';renderTabs();renderDestination(url)}
function renderDestination(url){const host=(()=>{try{return new URL(url).hostname}catch{return url}})();$('#view').innerHTML='<section class="hero"><div class="greeting"><span class="pulse"></span> Переход к сайту</div><h1 style="font-size:clamp(30px,5vw,48px);overflow-wrap:anywhere">'+esc(host)+'</h1><p class="subtitle">Веб-сайт откроется в новой вкладке браузера. Некоторые сайты запрещают встраивание внутрь других страниц.</p><div class="info-card"><div class="cardtop"><div class="cardicon">↗</div>Открыть страницу</div><p>'+esc(url)+'</p><div class="quick-actions"><button class="primary" id="openExternal">Открыть сайт ↗</button><button class="smallbtn" id="copyUrl">Копировать адрес</button><button class="smallbtn" id="saveUrl">☆ В закладки</button></div></div><div class="info-card" style="margin-top:14px"><div class="cardtop"><div class="cardicon">ⓘ</div>Почему сайт открывается отдельно?</div><p>CLOSE Browser сейчас работает как веб-приложение. Для полноценного браузера с движком Chromium, загрузками и расширениями потребуется отдельное приложение или оболочка на базе браузерного движка.</p></div></section>';
$('#openExternal').onclick=()=>window.open(url,'_blank','noopener,noreferrer');$('#copyUrl').onclick=()=>copy(url);$('#saveUrl').onclick=()=>addBookmark(url,host)}
function renderHome(){const t=current();if(t){t.url='';t.title='Новая вкладка'}$('#address').value='';$('#addressIcon').textContent='✦';renderTabs();$('#view').innerHTML='<section class="hero"><div class="greeting"><span class="pulse"></span> ТВОЁ ПРОСТРАНСТВО В СЕТИ</div><h1>Интернет.<br><span>По-твоему.</span></h1><p class="subtitle">Одна строка для поиска, открытий и новых идей.</p><form class="searchbox" id="searchForm"><span class="mag">⌕</span><input id="searchInput" placeholder="Что будем искать сегодня?" autocomplete="off"><button class="primary">Найти ↗</button></form><div class="engines"><span>Поиск:</span>'+Object.keys(engines).map(e=>'<button class="engine '+(engine===e?'active':'')+'" data-engine="'+e+'">'+e+'</button>').join('')+'</div><div class="sectionhead"><h2>Быстрый доступ</h2><button class="smallbtn" id="addShortcut">＋ Добавить</button></div><div class="shortcuts">'+shortcuts.map((s,i)=>'<button class="shortcut" data-shortcut="'+i+'"><span class="siteicon" style="color:'+esc(s.color||'var(--accent)')+'">'+esc(s.icon||'↗')+'</span><span>'+esc(s.name)+'</span><span class="remove" data-remove-shortcut="'+i+'">×</span></button>').join('')+'</div><div class="cards"><article class="info-card"><div class="cardtop"><span class="cardicon">◷</span>Недавно открывали</div><p id="recentSummary"></p><div class="quick-actions"><button class="smallbtn" data-panel="history">Открыть историю →</button></div></article><article class="info-card"><div class="cardtop"><span class="cardicon">☆</span>Твои закладки</div><p id="bookmarkSummary"></p><div class="quick-actions"><button class="smallbtn" data-panel="bookmarks">Все закладки →</button><button class="smallbtn" data-panel="settings">Настроить →</button></div></article></div></section>';
$('#searchForm').onsubmit=e=>{e.preventDefault();navigate($('#searchInput').value)};$('#recentSummary').textContent=history.length?history.slice(0,3).map(x=>x.title).join(' · '):'Здесь появятся сайты, которые ты посещал.';$('#bookmarkSummary').textContent=bookmarks.length?bookmarks.length+' сохранённых сайтов — всё под рукой.':'Сохраняй любимые сайты, чтобы возвращаться к ним быстрее.'}
function copy(s){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(s).then(()=>toast('Скопировано')).catch(()=>toast('Не удалось скопировать'));else toast('Адрес: '+s)}
function addBookmark(url,title){if(bookmarks.some(b=>b.url===url)){toast('Уже в закладках');return}bookmarks.unshift({url,title:title||url});save();$('#bookmarkCurrent').textContent='★';toast('Добавлено в закладки')}
function panel(name){const overlay=$('#overlay'),body=$('#dialogBody');overlay.classList.add('show');if(name==='history'){ $('#dialogTitle').textContent='История';body.innerHTML='<p style="color:var(--muted)">История хранится только в этом браузере на этом устройстве.</p>'+(history.length?history.map((h,i)=>'<div class="entry"><span>◷</span><span class="entryname"><b>'+esc(h.title)+'</b><small>'+esc(h.url)+' · '+new Date(h.time).toLocaleString()+'</small></span><button class="smallbtn" data-history="'+i+'">Открыть</button></div>').join(''):'<div class="empty">История пока пуста</div>')+'<button class="smallbtn" id="clearHistory">Очистить историю</button>';$('#clearHistory').onclick=()=>{history=[];save();panel('history');toast('История очищена')}}
else if(name==='bookmarks'){$('#dialogTitle').textContent='Закладки';body.innerHTML=bookmarks.length?bookmarks.map((b,i)=>'<div class="entry"><span>☆</span><span class="entryname"><b>'+esc(b.title)+'</b><small>'+esc(b.url)+'</small></span><button class="smallbtn" data-bookmark="'+i+'">Открыть</button><button class="smallbtn" data-delete-bookmark="'+i+'">×</button></div>').join(''):'<div class="empty">Закладок пока нет. Открой сайт и нажми ☆ в адресной строке.</div>'}
else if(name==='settings'){$('#dialogTitle').textContent='Настройки';body.innerHTML='<label>Поисковая система по умолчанию</label><select id="engineSelect">'+Object.keys(engines).map(e=>'<option '+(engine===e?'selected':'')+'>'+e+'</option>').join('')+'</select><label>Оформление</label><select id="themeSelect"><option value="dark" '+(theme==='dark'?'selected':'')+'>Тёмное</option><option value="light" '+(theme==='light'?'selected':'')+'>Светлое</option></select><p style="color:var(--muted);font-size:12px">Настройки, история и закладки сохраняются локально в браузере. Пароли и данные сайтов это приложение не собирает.</p><button class="primary" id="saveSettings">Сохранить настройки</button>'}
else{$('#dialogTitle').textContent='Конфиденциальность';body.innerHTML='<div class="info-card"><div class="cardtop">🔐 Локальные данные</div><p>История, закладки и быстрый доступ сохраняются в localStorage этого браузера. Они не синхронизируются между устройствами автоматически.</p><div class="quick-actions"><button class="smallbtn" id="clearLocal">Удалить историю и закладки</button></div></div><p style="color:var(--muted);font-size:12px">При поиске или открытии сайтов адрес и запрос передаются выбранной поисковой системе или соответствующему сайту.</p>';$('#clearLocal').onclick=()=>{if(confirm('Удалить всю локальную историю и закладки?')){history=[];bookmarks=[];save();panel('privacy');toast('Локальные данные удалены')}}}
}
function closePanel(){$('#overlay').classList.remove('show')}
$('#tabs').addEventListener('click',e=>{const close=e.target.closest('[data-close]');if(close){e.stopPropagation();const i=+close.dataset.close;tabs.splice(i,1);if(!tabs.length)addTab();else{active=Math.min(active,tabs.length-1);renderTabs();const t=current();t.url?renderDestination(t.url):renderHome()}return}const tab=e.target.closest('[data-tab]');if(tab){active=+tab.dataset.tab;const t=current();renderTabs();if(t.url){$('#address').value=t.url;renderDestination(t.url)}else renderHome();return}if(e.target.closest('#tabPlus'))addTab()});
$('#addressForm').onsubmit=e=>{e.preventDefault();navigate($('#address').value)};$('#go').onclick=()=>navigate($('#address').value);$('#newTab').onclick=()=>addTab();$('#back').onclick=()=>move(-1);$('#forward').onclick=()=>move(1);$('#reload').onclick=()=>{const t=current();if(t&&t.url)renderDestination(t.url);else renderHome()};function move(d){const t=current();if(!t||t.pos+d<0||t.pos+d>=t.stack.length){toast('Нет страниц для перехода');return}t.pos+=d;t.url=t.stack[t.pos];$('#address').value=t.url;renderTabs();renderDestination(t.url)}
$('#bookmarkCurrent').onclick=()=>{const t=current();if(t&&t.url)addBookmark(t.url,t.title);else toast('Сначала открой сайт')};
document.addEventListener('click',e=>{const p=e.target.closest('[data-panel]');if(p){panel(p.dataset.panel);return}const en=e.target.closest('[data-engine]');if(en){engine=en.dataset.engine;localStorage.setItem('close-engine',engine);renderHome();return}const rm=e.target.closest('[data-remove-shortcut]');if(rm){e.stopPropagation();shortcuts.splice(+rm.dataset.removeShortcut,1);save();renderHome();toast('Ярлык удалён');return}const sh=e.target.closest('[data-shortcut]');if(sh){const s=shortcuts[+sh.dataset.shortcut];if(s)navigate(s.url);return}const hb=e.target.closest('[data-history]');if(hb){const h=history[+hb.dataset.history];if(h){closePanel();navigate(h.url)}return}const bm=e.target.closest('[data-bookmark]');if(bm){const b=bookmarks[+bm.dataset.bookmark];if(b){closePanel();navigate(b.url)}return}const db=e.target.closest('[data-delete-bookmark]');if(db){bookmarks.splice(+db.dataset.deleteBookmark,1);save();panel('bookmarks');return}});
$('#addShortcut').onclick=()=>{const name=prompt('Название сайта:');if(!name)return;const raw=prompt('Адрес сайта:','https://');if(!raw)return;const url=normalize(raw);if(!url)return;shortcuts.push({name,url,icon:name.slice(0,1).toUpperCase(),color:'#8b7cff'});save();renderHome();toast('Ярлык добавлен')};
$('#closeDialog').onclick=closePanel;$('#overlay').addEventListener('click',e=>{if(e.target===$('#overlay'))closePanel()});document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='l'){e.preventDefault();$('#address').focus();$('#address').select()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='t'){e.preventDefault();addTab()}if(e.key==='Escape')closePanel()});
document.addEventListener('change',e=>{if(e.target.id==='engineSelect')engine=e.target.value;if(e.target.id==='themeSelect')theme=e.target.value});
document.addEventListener('click',e=>{if(e.target.id==='saveSettings'){engine=$('#engineSelect').value;theme=$('#themeSelect').value;localStorage.setItem('close-engine',engine);localStorage.setItem('close-theme',theme);applyTheme();closePanel();renderHome();toast('Настройки сохранены')}});
function applyTheme(){if(theme==='light'){document.documentElement.style.setProperty('--bg','#f2f3f8');document.documentElement.style.setProperty('--panel','#ffffff');document.documentElement.style.setProperty('--panel2','#e9eaf2');document.documentElement.style.setProperty('--line','#d9dbe7');document.documentElement.style.setProperty('--text','#20212c');document.documentElement.style.setProperty('--muted','#696b7c')}else{for(const [k,v] of Object.entries({'--bg':'#101116','--panel':'#191a22','--panel2':'#22232d','--line':'#30313d','--text':'#f5f5fa','--muted':'#a4a5b5'}))document.documentElement.style.setProperty(k,v)}}
applyTheme();addTab();
})();
</script>
</body>
</html>
